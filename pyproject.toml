[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingbot"
version = "0.1.0"
description = "Multi-agent sector-aware equity strategy engine with an explicit confidence layer"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
live = ["requests>=2.31"]
dev = ["pytest>=7.4"]

[project.scripts]
tradingbot = "tradingbot.cli:main"

[tool.setuptools.packages.find]
include = ["tradingbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
